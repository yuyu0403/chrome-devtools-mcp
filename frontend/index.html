<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>登入系統</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f4f6fb, #e9eef5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 390px;      
      padding: 35px;      
      border-radius: 16px; 
      box-shadow: 0 12px 36px rgba(0,0,0,.25); 
      text-align: center;
      cursor: grab;
      position: absolute; 
    }

    .login-card:active {
      cursor: grabbing;
    }

    .login-card h2 {
      margin-bottom: 18px;
      color: #333;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .login-card input:focus {
      outline: none;      
      box-shadow: none;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #4676dd ;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

        #result.error {
          color: red;
        }
      </style>
    </head>
    
    <body>
      <div class="login-card">
        <h2>系統登入</h2>
    
        <form id="loginForm" onsubmit="login(event)">
          <input id="account" placeholder="帳號" autocomplete="username" />
          <input id="password" type="password" placeholder="密碼" autocomplete="current-password" />
          <button type="submit" id="loginButton">登入</button>
        </form>
        <p id="result"></p>
      </div>
    
      <script>
        function login(event) {
          event.preventDefault(); 
    
          const accountInput = document.getElementById("account");
          const passwordInput = document.getElementById("password");
          const resultElement = document.getElementById("result");
    
          resultElement.classList.remove('error'); 
          resultElement.innerText = ''; 
    
          fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              account: accountInput.value.trim(),
              password: passwordInput.value.trim()
            })
          })
          .then(async res => {
            const data = await res.json();
    
            console.log(`${res.url} → ${res.status}`);
    
            if(res.status === 200 && data.success){
              resultElement.innerText = data.message + " ✅";
            }
            else if(res.status === 401){
              resultElement.innerText = data.message + " ❌";
              resultElement.classList.add('error'); 
              passwordInput.value = ''; 
            }
            else if(res.status === 422){
              resultElement.innerText = "格式錯誤：" + data.error + " ⚠️";
              resultElement.classList.add('error'); 
              passwordInput.value = ''; 
            }
          })
          .catch(err => {
            console.error(err);
            resultElement.innerText = "登入失敗，請檢查網路或稍後再試。";
            resultElement.classList.add('error');
            passwordInput.value = ''; 
          });
        }
        const card = document.querySelector('.login-card');

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        card.addEventListener('mousedown', (e) => {
          isDragging = true;

          offsetX = e.clientX - card.offsetLeft;
          offsetY = e.clientY - card.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          card.style.left = `${e.clientX - offsetX}px`;
          card.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
      </script>
    </body>
    </html>
